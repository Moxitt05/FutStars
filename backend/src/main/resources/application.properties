# Nombre de la aplicación
spring.application.name=futstars-backend

# Puerto del servidor
server.port=8080

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL/Supabase)
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
# Para desarrollo usamos "update" (crea/actualiza tablas automáticamente)
# Para producción cambiar a "validate" o "none"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# LOGGING
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.futstars=DEBUG

# ============================================
# SWAGGER/OPENAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# JWT CONFIGURATION
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ============================================
# API-FOOTBALL (para cuando la integremos)
# ============================================
# football.api.key=${API_FOOTBALL_KEY}
